# Labels for core/config/plugin.vikunja.settings.yml, merged into the Settings page.
url:
  label: Vikunja address
  info: 'The site the dashboard reads tasks from: https://<name>.ddev.site for one the builder made, or your own. No trailing slash.'
token:
  label: API token
  info: 'An API token (tk_…) of the account the dashboard reads (and, with writes on, writes) as, so it acts as that person: `bash cmd-tools-vikunja-cli.sh <site> --connect <login>` makes one through Vikunja''s API; on your own Vikunja, Settings → API Tokens, with the permissions of tasks, comments, labels, assignees, projects and their views and buckets. Never printed.'
allow_writes:
  label: Writes to Vikunja (tasks)
  info: 'Off: the AI works on a branch and nothing leaves this machine. On: you may comment, move a task on the board, label it and assign it, each a click after a preview, each a line in actions.log.'
  options:
    "false": "Off — nothing is written to Vikunja (default)"
    "true": "On — each write is your click after a preview"
max_agents:
  label: Author sessions at once
  info: 'How many AI sessions may work tasks at the same time. Each is a whole session in a project.'
  number: { min: 1, max: 8, step: 1 }
default_scope:
  label: Default Vikunja project
  info: 'The title of the Vikunja project a workspace project works against when it remembers none, as Webship site.'
scopes:
  label: Vikunja projects the list may switch to
  info: 'A list of project titles. Empty is any project the account can see. Edit it in the Raw YAML tab.'
work_in:
  label: Where the AI works
  info: 'A new branch in the project (a running site shows the change), or a git worktree outside the workspace folders (the project stays as it is).'
  options:
    branch: "A branch in the project (default)"
    worktree: "A worktree outside the workspace folders"
sandbox:
  label: Sandbox for the author session
  info: 'Required: Claude Code''s sandboxed Bash (no network, credentials denied), and no session without it. On Ubuntu 24.04 bubblewrap needs its AppArmor profile (see the tracker''s README). Off: your choice, said in the form.'
  options:
    required: "Required (default)"
    "off": "Off — the session is not sandboxed"
network_domains:
  label: Domains the sandbox allows
  info: 'The package registries the project needs (registry.npmjs.org, repo.packagist.org…). None by default. Edit it in the Raw YAML tab.'
allow_web:
  label: Web tools in the author session
  info: 'WebFetch and WebSearch. Off by default: a link in a task is not opened.'
  options:
    "false": "Off (default)"
    "true": "On"
comments_from:
  label: Comments the AI reads
  info: 'Members: only comments by the project''s owner and those it is shared with read & write or admin (default). All, or none.'
  options:
    members: "Owner, admin and read & write (default)"
    all: "All comments"
    none: "No comments"
outsider_items:
  label: Tasks from outside the project
  info: 'Made by someone the project is shared with read only, or not shared with. Analyze: analyze only, unless you tick a confirmation that names them. Refuse: analyze only.'
  options:
    analyze: "Analyze only, unless confirmed by name (default)"
    refuse: "Analyze only"
