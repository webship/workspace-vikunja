# Labels for core/config/plugin.leantime.settings.yml, merged into the Settings page.
url:
  label: Leantime address
  info: 'The site the dashboard reads tasks from: https://<name>.ddev.site for one the builder made, or your own. No trailing slash.'
token:
  label: Bearer token
  info: 'A bearer token of the account the dashboard reads (and, with writes on, writes) as, so it acts as that person: `bash cmd-tools-leantime-cli.sh <site> --connect <login>` makes one with Leantime''s own console (php bin/leantime auth:create-bearer-token on your own Leantime). Never printed.'
allow_writes:
  label: Writes to Leantime (tasks)
  info: 'Off: the AI works on a branch and nothing leaves this machine. On: you may comment, set a task''s status, assign it and log time on it, each a click after a preview, each a line in actions.log.'
  options:
    "false": "Off — nothing is written to Leantime (default)"
    "true": "On — each write is your click after a preview"
max_agents:
  label: Author sessions at once
  info: 'How many AI sessions may work tasks at the same time. Each is a whole session in a project.'
  number: { min: 1, max: 8, step: 1 }
default_scope:
  label: Default Leantime project
  info: 'The name of the Leantime project a workspace project works against when it remembers none, as Webship site.'
scopes:
  label: Leantime projects the list may switch to
  info: 'A list of project names. Empty is any project the account is a member of. Edit it in the Raw YAML tab.'
work_in:
  label: Where the AI works
  info: 'A new branch in the project (a running site shows the change), or a git worktree outside the workspace folders (the project stays as it is).'
  options:
    branch: "A branch in the project (default)"
    worktree: "A worktree outside the workspace folders"
sandbox:
  label: Sandbox for the author session
  info: 'Required: Claude Code''s sandboxed Bash (no network, credentials denied), and no session without it. On Ubuntu 24.04 bubblewrap needs its AppArmor profile (see the tracker''s README). Off: your choice, said in the form.'
  options:
    required: "Required (default)"
    "off": "Off — the session is not sandboxed"
network_domains:
  label: Domains the sandbox allows
  info: 'The package registries the project needs (registry.npmjs.org, repo.packagist.org…). None by default. Edit it in the Raw YAML tab.'
allow_web:
  label: Web tools in the author session
  info: 'WebFetch and WebSearch. Off by default: a link in a task is not opened.'
  options:
    "false": "Off (default)"
    "true": "On"
comments_from:
  label: Comments the AI reads
  info: 'Members: only comments by the project''s Editors and above (default). All, or none.'
  options:
    members: "Editors and above (default)"
    all: "All comments"
    none: "No comments"
outsider_items:
  label: Tasks from outside the project
  info: 'Made, or last edited, by a Commenter, a Read Only person or someone with no membership. Analyze: analyze only, unless you tick a confirmation that names them. Refuse: analyze only.'
  options:
    analyze: "Analyze only, unless confirmed by name (default)"
    refuse: "Analyze only"
