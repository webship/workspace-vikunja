# Leantime — core/config/plugin.leantime.settings.yml
#
# The Leantime the dashboard reads tasks from: a site the builder made (https://<name>.ddev.site), or your own. The
# token is a bearer token of an account there, so the dashboard acts as that person: `cmd-tools-leantime-cli.sh <site>
# --connect <login>` makes one with Leantime's own console. Never printed.
# The Leantime address, without a trailing slash.
url: CHANGE_ME
# A bearer token of the account the dashboard reads (and, with writes on, writes) as.
token: CHANGE_ME
# The tasks as work items (the tracker family). See @webship.co/workspace-tracker for every key.
# Writes to Leantime: comments, statuses, assignees, logged time, new tasks. Off by default.
allow_writes: false
# Author sessions at once.
max_agents: 1
# The Leantime project a workspace project works against when it remembers none: its name (Webship site).
default_scope: ""
# The Leantime projects (their names) the list may be switched to; empty is any project the account is a member of.
scopes: []
# branch: a new branch in the project; worktree: a git worktree outside the workspace folders.
work_in: branch
# required: Claude Code's sandbox for the author session, and no session without it; off: a person's choice.
sandbox: required
# Domains the sandbox allows (the project's package registries).
network_domains: []
# WebFetch and WebSearch in the author session.
allow_web: false
# The comments a snapshot keeps: members (the project's Editors and above), all, none.
comments_from: members
# A task from outside the project (made, or last edited, by a Commenter, a Read Only person or someone with no membership): analyze (work it only after a confirmation that names its author) or refuse.
outsider_items: analyze
